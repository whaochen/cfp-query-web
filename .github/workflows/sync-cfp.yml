name: Sync MOENV CFP Datasets (CFP_P_01 & CFP_P_02)

on:
  schedule:
    # 每週一台北時間 10:00 (UTC 02:00) 自動檢查更新
    - cron: "0 2 * * 1"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Fetch and diff CFP_P_02 & CFP_P_01 datasets
        env:
          MOENV_API_KEY: ${{ secrets.MOENV_API_KEY }}
        run: python scripts/sync_cfp.py

      - name: Commit and push if data changed
        run: |
          if [ -n "$(git status --porcelain data/)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/
            git commit -m "chore(data): sync MOENV CFP_P_01 & CFP_P_02 datasets"
            git push
          else
            echo "No changes in data/."
          fi
